# ============================================================================
#  求职画像模板 · Profile Template
#  ---------------------------------------------------------------------------
#  这是**你自己的**信息，不随项目分发。两种用法：
#
#    A. 跑 `radar init` 自动生成一份，再对照本文件的注释细调（推荐）
#    B. 直接复制本文件到 ~/.cn-job-radar/config/profile.yaml，
#       把标了  <<< 填写 >>>  的地方改成你自己的
#
#  改完保存即生效，下次 `radar run` 就会按新画像打分。
#  每次运行都会把当时的画像快照到 ~/.cn-job-radar/data/profiles/，方便回溯。
# ============================================================================

version: 1
updated_at: "2026-01-01"


# ---------------------------------------------------------------------------
#  【1】关注哪些行业
#       填行业包 id，可多选。跑 `radar industries` 看全部可选项。
#
#       可选项：ai · robotics · semiconductor · biotech ·
#               newenergy · autotech · finance · general
# ---------------------------------------------------------------------------
industries:
  - robotics        # <<< 填写 >>>
  - ai


# ---------------------------------------------------------------------------
#  【2】硬性筛选 —— 不满足直接丢弃，不进入打分
# ---------------------------------------------------------------------------
filters:
  # <<< 填写 >>> 目标城市。可以有多个，第一个是「主城市」。
  #     主城市拿满分；「主城市 + 其他城市」的双地点岗位拿 78 分；纯外地 20 分。
  cities:
    - 北京
    # - 上海

  # true  = 只要上面列的城市，外地岗位直接丢
  # false = 外地岗位降权保留（推荐，偶尔会有好机会）
  city_strict: false

  # 岗位名命中任一关键词 → 直接丢弃。
  # 注意只匹配**岗位名**，不看 JD 正文 —— 否则正文里一句「欢迎应届生」会误杀整个岗位。
  # <<< 按需增删 >>>：不想去外包就留「外包」；有工作经验就把「应届」「校招」留着。
  exclude_keywords:
    - 实习
    - intern
    - 外包
    - 劳务派遣
    - 兼职
    - 校招
    - 校园
    - 应届
    - 优才

  # URL 命中即丢弃 —— 用来剔除校园招聘通道
  exclude_url_patterns:
    - campusrecruitment
    - /campus
    - /school

  # 月薪下限（单位：千元）。0 = 不限。
  # 招聘方没写薪资时不会因此被误杀。
  min_salary_k: 0

  # <<< 填写 >>> 明确不想投的公司（关键词即可）
  exclude_companies: []
  # - 某某公司


# ---------------------------------------------------------------------------
#  【3】岗位轨道 —— 想关掉哪条就把 enabled 改成 false
# ---------------------------------------------------------------------------
tracks:
  # ---- 轨道 A：产业岗（公司内部的岗位）----
  industry:
    enabled: true
    label: 产业岗
    emoji: "🤖"

    # 岗位关键词由 industry 段选的行业包自动提供，这里只写**额外排除**的岗位类型。
    # 想覆盖行业包的关键词，就自己写 title_keywords（格式见 industries/*.yaml）：
    #
    # title_keywords:
    #   strong:      # 命中直接 100 分
    #     - 产品经理
    #     - 战略
    #   normal:      # 命中 68 分
    #     - 算法
    #     - 工程师

    title_blocklist:
      - 电话销售
      - 保险
      - 房产

    # 权重合计 100。想突出哪一维就调大它，同时把别的调小。
    weights:
      title_match: 15     # 岗位名匹配度
      quality: 22         # 公司质量（融资背书 + 融资新鲜度）
      body_fit: 20        # JD 与你背景的契合度
      experience: 28      # ★ 经验门槛：要求越低分越高
      freshness: 5        # 岗位新鲜度
      city: 10            # 城市匹配

  # ---- 轨道 B：投资岗（VC / PE / CVC 的投资、投研岗）----
  # 这类岗位**不会出现在企业官方招聘门户上**，只能靠 BOSS直聘 / 猎聘 检索后
  # 写进 data/raw/*.json 参与打分。所以在公司门户上它是空的 —— 这是正常的。
  investment:
    enabled: false        # <<< 想找投资岗就改成 true >>>
    label: 投资岗
    emoji: "💼"
    title_blocklist:
      - 投资顾问          # 销售性质，不是买方投资
      - 理财
      - 财富管理
      - 客户经理
    weights:
      title_match: 15
      quality: 22
      body_fit: 20
      experience: 28
      freshness: 5
      city: 10


# ---------------------------------------------------------------------------
#  【4】★ 个人背景 —— 这一段最重要，直接决定打分准不准
#       系统**不会**把你的简历上传到任何地方，这些关键词只在本地参与计算。
# ---------------------------------------------------------------------------
candidate:

  # <<< 填写 >>> 你的加分词：JD 里出现这些 → 说明岗位在找的东西你有。
  #     怎么填：把「你会的技能 / 你的学历标签 / 你的经验类型」列出来。
  #     命中越多「背景契合」分越高（15 个封顶）。
  #
  #     参考维度：专业背景 · 技术栈 · 行业经验 · 语言能力 · 软技能
  strength_keywords:
    # - 数学
    # - 计算机
    # - 金融
    # - 理工科
    # - 硕士
    # - 海外
    # - 英语
    # - Python
    # - 数据分析
    # - 行业研究
    # - 项目管理
    # - 沟通
    - 沟通
    - 协作
    - 项目管理

  # <<< 填写 >>> 你的缺口词：JD 里出现这些 → 说明你够不着，
  #     每条会让「背景契合」扣 15 分，同时日报里会单独标出来「这条你差在哪」。
  #     怎么填：把「岗位常要求但你确实没有的硬门槛」列出来。
  gap_keywords:
    # - 博士
    # - 8年以上
    # - 独立主导
    # - 完整退出案例


# ---------------------------------------------------------------------------
#  【5】公司 / 机构质量 —— 决定「优质」怎么算
#       留空则自动使用行业包内置的机构名单（推荐）。
#       只有当你有明确偏好（比如只想投某几家机构的被投企业）时才自己写。
# ---------------------------------------------------------------------------
quality:
  funding_recency:      # 融资越新越加分
    - {max_days: 90, score: 100}
    - {max_days: 180, score: 80}
    - {max_days: 365, score: 55}
    - {max_days: 730, score: 30}
    - {max_days: 99999, score: 10}

  # tier1_investors: []   # <<< 可选填写 >>> 你认为「一线」的机构，命中即高分
  # tier2_investors: []


# ---------------------------------------------------------------------------
#  【6】经验门槛 —— 这是「哪些岗位值得看」的关键维度，权重最高
#       系统从 JD 里读出「X 年以上」，门槛越低分越高。
#       想整体放松/收紧，只改下面的 score 就行；想彻底关掉，
#       把 tracks.*.weights.experience 改成 0，并把多出来的 28 分加到别处。
# ---------------------------------------------------------------------------
experience_gate:
  unspecified: 72         # JD 里没写年限时给的分（中性偏正面）
  bands:                  # 注意：取 JD 中出现的**最小**门槛年数
    - {max_years: 1, score: 100}    # 应届 / 1 年以内
    - {max_years: 2, score: 95}
    - {max_years: 3, score: 88}
    - {max_years: 5, score: 68}
    - {max_years: 8, score: 38}
    - {max_years: 99, score: 15}    # 10 年以上
  hard_gate_keywords:     # 命中直接压到 hard_gate_score
    - 博士
    - 10年以上
    - 十年以上
  hard_gate_score: 20


# ---------------------------------------------------------------------------
#  【7】输出设置
#  ---------------------------------------------------------------------------
output:
  top_n_per_track: 25     # 每条轨道日报里最多列多少条
  min_score: 0            # 低于这个分不进日报（想过滤噪音可以设 50）
  alert_score: 80         # ≥ 这个分在日报顶部标红。实测：优质公司+目标城市+
                          #   关键词命中+低经验门槛 ≈ 80-85 分，所以 80 比较合适
  keep_reports_days: 90   # 日报保留天数
